name: Build & Publish Relay Docker Package

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/p2ptunnel-relay

jobs:
  docker-relay:
    name: Build & Push Relay Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        id: img
        run: |
          echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Relay Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate standalone docker-compose.yml for deployment
        run: |
          mkdir -p dist-relay
          cat <<EOF > dist-relay/docker-compose.yml
          services:
            p2ptunnel-relay:
              image: ${{ steps.img.outputs.name }}:latest
              container_name: p2ptunnel-relay
              restart: unless-stopped
              environment:
                RELAY_IP: "0.0.0.0"
                RELAY_PORT: "4433"
                RELAY_SECRET: "change-this-relay-secret"
              ports:
                - "0.0.0.0:4433:4433/tcp"
                - "0.0.0.0:4433:4433/udp"
          EOF

      - name: Upload docker-compose.yml artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-docker-compose
          path: dist-relay/docker-compose.yml
